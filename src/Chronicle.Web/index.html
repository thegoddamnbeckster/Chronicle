<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle</title>
    <!-- Anti-flash: apply cached CSS variables before React mounts -->
    <script>
      (function () {
        try {
          var vars = JSON.parse(localStorage.getItem('chronicle_theme_vars') || 'null');
          if (vars && typeof vars === 'object') {
            var root = document.documentElement;
            for (var name in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, name) && name.startsWith('--')) {
                root.style.setProperty(name, vars[name]);
              }
            }
            // Same as ThemeContext: native controls (the open list of a <select>) follow the scheme, not the variables.
            var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec((vars['--bg-primary'] || vars['--bg-secondary'] || '').trim());
            if (m) {
              var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
              var lum = (0.2126 * parseInt(h.slice(0, 2), 16) + 0.7152 * parseInt(h.slice(2, 4), 16) + 0.0722 * parseInt(h.slice(4, 6), 16)) / 255;
              root.style.colorScheme = lum < 0.5 ? 'dark' : 'light';
            }
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
